name: Cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiseki:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: homebrew-tap
      - uses: jdx/mise-action@v4
        with:
          version: 2026.10.25
          working_directory: homebrew-tap
          install_args: dprint actionlint shellcheck ruff
      - name: Check formatting and workflows
        working-directory: homebrew-tap
        run: mise run check
      - name: Check local cask style
        working-directory: homebrew-tap
        run: mise run lint:cask
      - name: Tap the proposed checkout
        run: |
          brew tap naviapps/tap "file://${GITHUB_WORKSPACE}/homebrew-tap"
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask naviapps/tap/kiseki
          fi
      - name: Audit
        run: brew audit --strict --online --cask naviapps/tap/kiseki
      - name: Verify published checksum
        run: |
          brew info --json=v2 --cask naviapps/tap/kiseki > "${RUNNER_TEMP}/kiseki-cask.json"
          python3 homebrew-tap/scripts/verify-published-checksum.py
      - name: Install and verify
        run: |
          brew install --cask --require-sha --appdir="${RUNNER_TEMP}/kiseki-apps" naviapps/tap/kiseki
          python3 homebrew-tap/scripts/verify-installed-app.py
          codesign --verify --deep --strict --verbose=2 "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
          spctl --assess --type execute --verbose=2 "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
      - name: Seed cleanup fixtures
        run: |
          python3 homebrew-tap/scripts/seed-cleanup-fixtures.py
      - name: Verify ordinary uninstall preserves data
        run: |
          brew uninstall --cask naviapps/tap/kiseki
          test ! -e "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
          python3 homebrew-tap/scripts/verify-uninstall-preserves-data.py
      - name: Verify zap removes only app data
        run: |
          brew uninstall --cask --zap --force naviapps/tap/kiseki
          python3 homebrew-tap/scripts/verify-zap-removes-app-data.py
      - name: Uninstall
        if: always()
        run: |
          if brew list --cask naviapps/tap/kiseki >/dev/null 2>&1; then
            brew uninstall --cask naviapps/tap/kiseki
          fi
          test ! -e "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
