name: Cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiseki:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: dprint actionlint shellcheck rust
      - name: Fetch locked verifier dependencies
        run: mise run cask:fetch-verifier
      - name: Check formatting and workflows
        run: mise run check
      - name: Test verification helpers
        run: mise run test:helpers
      - name: Check local cask style
        run: mise run lint:cask
      - name: Tap the proposed checkout
        run: |
          brew tap naviapps/tap "file://${GITHUB_WORKSPACE}"
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask naviapps/tap/kiseki
          fi
      - name: Record metadata for the installed cask definition
        run: brew info --json=v2 --cask naviapps/tap/kiseki > "${RUNNER_TEMP}/kiseki-cask.json"
      - name: Audit
        run: brew audit --strict --online --cask naviapps/tap/kiseki
      - name: Verify the downloaded disk image
        id: dmg
        run: |
          brew fetch --cask naviapps/tap/kiseki
          dmg_path="$(brew --cache --cask naviapps/tap/kiseki)"
          mise run cask:verify -- --verify-appcast --dmg "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
          printf 'path=%s\n' "$dmg_path" >> "$GITHUB_OUTPUT"
      - name: Install and verify
        run: |
          brew install --cask --require-sha --appdir="${RUNNER_TEMP}/kiseki-apps" naviapps/tap/kiseki
          mise run cask:verify -- --verify-installed
          codesign --verify --deep --strict --verbose=2 "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
          spctl --assess --type execute --verbose=2 "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
      - name: Verify the Sparkle update signature
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          mise run cask:verify -- --dmg "$DMG_PATH" \
            --sparkle-bundle "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
      - name: Seed cleanup fixtures
        run: mise run cask:verify -- --cleanup-fixtures seed
      - name: Verify ordinary uninstall preserves data
        run: |
          brew uninstall --cask naviapps/tap/kiseki
          test ! -e "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
          mise run cask:verify -- --cleanup-fixtures verify-uninstall
      - name: Verify zap removes only app data
        run: |
          # The ordinary uninstall removes this cask's individual trust.
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask naviapps/tap/kiseki
          fi
          brew uninstall --cask --zap --force naviapps/tap/kiseki
          mise run cask:verify -- --cleanup-fixtures verify-zap
      - name: Uninstall
        if: always()
        run: |
          if brew list --cask naviapps/tap/kiseki >/dev/null 2>&1; then
            brew uninstall --cask naviapps/tap/kiseki
          fi
          test ! -e "${RUNNER_TEMP}/kiseki-apps/Kiseki.app"
